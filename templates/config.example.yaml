# Diagnostic system prompt for Jules session responses
diagnostic_prompt: |
  You are a diagnostic help agent talking to a non-technical user. Explain bugs and issues in simple, everyday terms. Avoid developer jargon, deep technical code details, and raw code blocks unless explicitly requested. Use clear analogies to explain what is wrong. Do NOT modify the codebase, write code changes, or create pull requests unless a program-level bug is identified and the user explicitly asks for a code fix. Keep conversation interactive, clear, and friendly.

# Default Bot Emoji (rendered in message headers and plan embeds)
bot_emoji: "🐙"

# Access Control Allowlist
access_control:
  allow_all: false
  silent: false # If true, unauthorized interactions are silently ignored
  allowed_users: [] # e.g. ["123456789012345678"]
  allowed_roles: [] # e.g. ["112233445566778899"]

# Status Reactions Emojis (Supports Unicode, <:name:id>, name:id, or raw ID)
# Messages waiting behind another Jules turn keep the queued reaction until sent.
reactions:
  queued: "⏳"
  in_progress: "⚙️"
  responded: "💬"
  awaiting_plan_approval: "📋"
  paused: "⏸️"
  completed: "✅"
  failed: "❌"

# Optional Guild-specific mappings (Overrides database slash command configuration)
guilds: {}
  # "YOUR_GUILD_ID":
  #   default_repo: "owner/repo"
  #   forum_channel_id: "YOUR_FORUM_CHANNEL_ID"
  #   chat_channel_id: "YOUR_NORMAL_TEXT_CHANNEL_ID" # Optional shared chatbot channel

# Auto-reject proposed plans once per session
auto_reject:
  enabled: false
  message: "Please do not create or refine an implementation plan. Respond directly to the previous prompt and do not try to refine the implementation plan."

# Let Jules add Discord reactions to the user's message (opt-in).
# When enabled, the session prompt teaches Jules a text marker — [[react:👍]] —
# which the bot parses out and turns into a real reaction (overriding the status
# reaction above), then strips from the message so it never shows literally.
# Supports Unicode emoji and custom server emoji (:name: or <:name:id>).
# Customise the wording via messages.prompts.jules_reactions_instruction below.
jules_reactions:
  enabled: false

# Send Jules one reminder when a dispatched Discord message has not received a
# user-facing response within this many minutes. The timer is cancelled as soon
# as Jules replies or presents a plan. By default, a silent Discord reply also
# confirms that the reminder was sent.
nudge:
  enabled: false
  after_minutes: 5
  notify_discord: true
  # Optional direct text overrides. When omitted, the defaults come from
  # messages.prompts.response_nudge and messages.session.nudge_sent.
  # message: "Please respond directly to the most recent Discord message now."
  # discord_message: "🔔 **No reply after {delay}, so I reminded Jules.**"

# Centralized Jules activity polling. This block is PROCESS-GLOBAL (it is not
# resolved per channel/tag/thread/role). Active work polls quickly. Once Jules has
# replied, is waiting for input/approval, is paused, or has completed, polling
# slows down and stops entirely after one idle hour. A new Discord message or
# approval wakes the session immediately. All sessions and one-off Jules calls
# share the same concurrency/rate-limit coordinator so a 429 backs off the whole
# bot instead of causing a retry herd.
jules_polling:
  active_interval_ms: 5000
  idle_interval_ms: 60000
  idle_timeout_ms: 3600000
  max_concurrency: 3
  min_request_spacing_ms: 250
  rate_limit_base_delay_ms: 30000
  rate_limit_max_delay_ms: 300000

# Optional global routing/delivery defaults. These settings (unlike jules_polling)
# participate in the normal defaults -> global -> channel -> tag -> thread -> role
# precedence chain where a more specific override exists.
# default_repo: "owner/repo"     # Global repo setting; YAML guild/channel/tag/thread/role can override it
# default_branch: "main"         # Branch fallback when no more-specific branch is set
# typing_indicator_mode: "until_response" # until_response | strict_state
# bootstrap: true                # Include bootstrap/ in normal session prompts (see pre-warm caveat in docs)
# reply_mode: "send"             # send | reply_silent | reply_ping
#   send         = post normally in the thread/channel
#   reply_silent = reply to the triggering Discord message without pinging its author
#   reply_ping   = reply to the triggering Discord message with normal reply mention behavior
# reply_context_mode: "message_id" # message_id | full_message | none
#   message_id   = (default) lightweight, synchronous ID referencing (Message ID + In reply to Message ID)
#   full_message = fetch and quote the referenced message text + author
#   none         = ignore reply references completely

# Force interactive repository and branch selection on thread creation.
# If true, shows an embed with select menus allowing developers to pick a connected repo and branch.
# If false, automatically proceeds with default repository and branch.
interactive_selection: false

# Messages starting with this prefix will be completely ignored by the bot (e.g. "!")
ignore_prefix: ""

# Bot Presence Configuration
presence:
  status: "online" # online, idle, dnd, invisible
  activity: "Diagnostic Logs"
  activity_type: "Watching" # Playing, Watching, Listening, Competing, Streaming, Custom
  # url: "https://twitch.tv/..." # Required for Streaming type

# Pre-warmed session pool configuration (opt-in)
pre_warmed_sessions:
  enabled: false
  pool_size: 1
  # Optional: Instructions sent only to pre-warmed sessions during initialization.
  # Use this to give Jules background tasks or specific focus areas before the user connects.
  pre_warming_prompt: |
    You are a diagnostic assistant. The user is connecting and has just sent their initial response. 
    Acknowledge that you are showing this message now that they have replied. 
    Share an extremely obscure, niche, or lesser-known Pokémon trivia fact (avoiding common, generic facts), and let them know you are actively analyzing the codebase and working on their query right now. 
    Even though you don't see their query yet, respond as if you have received a query from the user and are working on it.
    Do NOT propose code changes yet; generate the initial plan to welcome them and begin investigation.

# Optional Channel and Thread-specific Overrides
# You can override any global configuration options (e.g., diagnostic_prompt, access_control, reactions, auto_reject, nudge)
# at the Channel ID level or Thread ID level.
# channels:
#   "YOUR_CHANNEL_OR_FORUM_ID": # Channel or Forum ID
#     diagnostic_prompt: |
#       You are a diagnostic assistant. Please write extremely concise replies.
#     access_control:
#       allow_all: true
#     auto_reject:
#       enabled: true
#       message: "Plan automatically rejected for this channel."
#     reactions:
#       queued: "⏳"
#       in_progress: "⚙️"

# Optional Role-specific Overrides
# Forum authorization and initial session creation use the thread creator's role
# context. Some later reply/UI paths currently resolve role overrides against the
# current participant instead, so role-specific presentation settings are not an
# immutable per-thread snapshot. Normal text channels use the current speaker.
# See docs/CONFIGURATION.md for the exact current behavior.
# For example, if a Developer starts a thread, you can restrict access to only Developers:
# roles:
#   "Developer": # Role Name or Role ID
#     access_control:
#       allow_all: false
#       allowed_roles:
#         - "Developer"
#         - "Admin"
#     diagnostic_prompt: |
#       You are a technical assistant. Provide deep code explanations.

# Optional Forum Tag-specific Overrides
# Overrides configuration based on the tags applied to a forum post (thread).
# Each key is matched against the post's applied tags by tag NAME or tag ID, so
# posts can be routed by category. A post may carry several tags; all matching
# entries are merged in the order they appear below (later keys win).
# Precedence sits between the channel and thread layers — a tag override beats a
# parent-channel override but yields to a thread-specific or role override.
# tags:
#   "urgent": # Forum tag name or ID
#     diagnostic_prompt: |
#       Be extremely concise. Prioritise a fast root-cause answer over detail.
#     access_control:
#       allow_all: true
#   "feature-request":
#     auto_reject:
#       enabled: false
#     default_branch: "develop"

# Full setting/scope/reference notes: docs/CONFIGURATION.md
# Runtime flow/recovery notes: docs/ARCHITECTURE.md

# Customizable text strings
# Every user-facing string (and the substantive Jules-prompt fragments) lives in
# `src/strings.ts` as the default. Override any of them here — you only need to
# list the keys you want to change; everything else falls back to the defaults.
# Templated strings use {placeholder} tokens (e.g. {emoji}, {repo}, {branch},
# {error}, {feedback}); keep the placeholders you need in your override.
#
# Like the other settings above, `messages:` can also be nested under a specific
# channel/forum (`channels:`), forum tag (`tags:`), or role (`roles:`) block to
# override strings only in that context. The precedence is:
# defaults -> global -> channel -> tag -> thread -> role.
#
# messages:
#   errors:
#     no_permission_session: "🚫 Sorry, you can't use this diagnostic session."
#   session:
#     initializing: "{emoji} Spinning up Jules against `{repo}` (`{branch}`)…"
#     prewarmed_ready: "⚡ Got a warm session — on it!"
#   plan:
#     approve_button: "Looks good ✅"
#     reject_button: "Not quite ❌"
#   stream:
#     completed: "✅ All done!"
#   # See src/strings.ts for the full list of keys you can override.


