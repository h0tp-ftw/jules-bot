errors:
  guild_only: ❌ This command can only be used in a server.
  no_permission_commands: ❌ **You do not have permission to run bot commands.**
  no_permission_session: ❌ **You do not have permission to interact with this diagnostic session.**
  no_permission_interaction: ❌ **You do not have permission to interact with this session.**
  command_execution_error: |-
    ❌ **There was an error executing this command:**
    ```
    {error}
    ```
  session_not_found: ❌ Session not found.
  repo_not_found: ❌ Selected repository not found.
  jules_communication_error: ❌ **An error occurred while communicating with Jules.**
  session_setup_error: ❌ **An error occurred while setting up the session.**
session:
  initializing: |-
    {emoji} **Initializing diagnostic Jules session...**
    Running analysis against repository: `{repo}` on branch `{branch}`...
  initializing_repoless: |-
    {emoji} **Initializing diagnostic Jules session...**
    Running analysis in a standalone cloud sandbox (No codebase)...
  start_failed: ❌ **Failed to start Jules diagnostic session. Please verify your
    repository configuration and permissions.**
  starter_message_unavailable: ⚠️ **Could not retrieve the starter message for
    this thread. Please reply with your issue details to start.**
  queued_timeout: ⚠️ Jules session timed out waiting to start. Please open a new thread.
  analysis_failed_retries: |-
    ❌ **The diagnostic analysis session failed after multiple reconnection attempts:**
    ```
    {error}
    ```
  prewarming_wait: ⏳ **A session is currently pre-warming. Waiting for it to become ready...**
  prewarmed_ready: 🚀 **Ready session found! Processing your issue...**
  message_delivery_failed: ❌ **Failed to deliver message to Jules. Please make
    sure the session is still active.**
  paused_notice: |-
    ⏸️ **Jules has paused this session.**
    An admin or repository collaborator needs to visit the [Jules UI]({url}) and click **Resume session** to continue.
  nudge_sent: 🔔 **Jules had not replied after {delay}, so I sent a reminder.**
  nudge_delay_minute: "{minutes} minute"
  nudge_delay_minutes: "{minutes} minutes"
  shutdown_queue_active: |-
    🛑 **The bot is stopping while this message is active.**
    Jules may continue working, but Discord delivery is paused until the bot returns. Please resend this message only if no reply appears after restart.{pending}
  shutdown_queue_pending_one: |-

    ⚠️ **1 later queued message is held only in memory and may need to be resent.**
  shutdown_queue_pending_many: |-

    ⚠️ **{count} later queued messages are held only in memory and may need to be resent.**
  completion_fallback: |-
    ✅ **Jules finished the run but did not send a final conversational reply.**
    No pull request or merge was confirmed by the Jules result.
  completion_fallback_progress: |-
    ✅ **Jules finished the run but did not send a final conversational reply.**
    Latest recorded update: `{progress}`
    No pull request or merge was confirmed by the Jules result.
  completion_fallback_pr: |-
    ✅ **Jules finished the run but did not send a final conversational reply.**
    A pull request was reported by Jules: {url}
    **Merge status was not verified.**
  default_title: Diagnostic Session
